[package]
name = "s3-headers-lite"
authors = ["Dane Stuckel <dane@softwarepatterns.com>"]
description = "A minimal, lightweight alternative to the official AWS crates. Only the headers necessary for communicating with S3-like services."
version = "0.1.0"
edition = "2021"
readme = "README.md"
repository = "https://github.com/softwarepatterns-com/s3-headers-lite"
license = "Apache-2.0"
keywords = ["s3", "aws", "sigv4", "headers", "signing"]
categories = ["authentication", "web-programming::http-client"]
documentation = "https://docs.rs/s3-headers-lite"
include = ["/src", "/LICENSE"]

[lib]
bench = false

[dependencies]
hmac = "0.12.1"
percent-encoding = "2.3.0"
sha2 = "0.10.8"
time = { version = "0.3.23", features = ["formatting", "macros"] }
url = "2.4.0"
hex = "0.4.3"

[dev-dependencies]
dotenvy = "0.15.7"
quick-xml = "0.30.0"
reqwest = { version = "0.11.18", features = ["blocking"] }
serde = { version = "1.0.195", features = ["alloc", "derive"] }
serde-xml-rs = "0.6.0"
hex-literal = "0.4.1"
